<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek Tahun Kabisat</title>
</head>
<body>
    <h2>Cek Tahun Kabisat</h2>
    <label for="tahun">Masukkan Tahun</label>
    <input type="number" id="tahun" placeholder="Contoh: 2024">
    <button onclick="cekTahunKabisat()">Cek</button>

    <p id="hasil"></p>

    <script>
        function cekTahunKabisat() {
            const tahun = Number(document.getElementById("tahun").value);
            const hasil = document.getElementById("hasil");

            if (tahun % 400 === 0) {
                hasil.textContent = tahun + " adalah tahun kabisat.";
            } else if (tahun % 4 === 0 && tahun % 100 !== 0) {
                hasil.textContent = tahun + " adalah tahun kabisat.";
            } else {
                hasil.textContent = tahun + " bukan tahun kabisat.";
            }
        }
    </script>
</body>
</html>
